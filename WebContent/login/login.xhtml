<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd" >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:t="http://myfaces.apache.org/tomahawk">


<h:head>
	<title>OFICINA NACIONAL DE PRESUPUESTO</title>
	<h:outputStylesheet library="css" name="login.css"/>
	<script name="jquery/jquery.js" library="primefaces"></script>
</h:head>

<h:body >

	<h:form>
	 
	  <h:graphicImage value="/templates/images/fondo_sistemas.png" styleClass="full-screen-background-image"/> 
		<table width="100%" border="0" align="center" cellpadding="0"
			cellspacing="0">
			<tr>
				<td align="center"><a name="topLeft" id="topLeft"></a> 
					<h:graphicImage	value="/templates/images/membrete2013.jpg" />
				</td>
			</tr>
		</table>
		
		<p:growl showDetail="true" autoUpdate="true" closable="true" id="mensaje"/>
		
		<div id="informacion" style="position: absolute;float: left;top: 250px;left:80px; z-index: 99;">
			<table width="625" border="0" align="center" cellpadding="0" cellspacing="0">
			<tr>
				<td width="185" rowspan="2"><h:graphicImage value="/templates/images/Ejecucion_Financiera1.png"  style="width: 180px;"/></td>
			    <td width="440">
				    <div style="border:0;font-size:10pt;margin:0 auto;padding:5px 0;text-align:center;width:90%;z-index:9999; bottom:10px; font-family:Verdana, Arial, Helvetica, sans-serif; font-size:14px;">
				      <p style="font-family: Verdana, Arial, Helvetica, sans-serif; font-weight: bold; font-size: 14px;">Sistema  de Ejecución Presupuestaria para Entes Descentralizados (SEPED)</p>
				      <p style="font-family: Verdana, Arial, Helvetica, sans-serif; font-weight: bold; font-size: 11px;">Copyrigh &copy; Oficina Nacional de Presupuesto<br/>Todos los Derechos Reservados <br /> Version 1.0 </p>
				    </div>
			    </td>
			</tr>
			<tr>
			  <td style="text-align: center; font-family: Verdana, Arial, Helvetica, sans-serif; font-weight: bold; font-size: 11px; color: green;">
			    <p>Acroba Reader <a href="https://get.adobe.com/es/reader/" target="_blank" >(Descargar)</a><br/>
                   Manual de Usuario <a href="http://www.onapre.gob.ve/index.php/publicaciones/descargas/viewcategory/53-instructivos-y-manuales-ano-2016" target="_blank" >(Descargar)</a></p>
              </td>
  			</tr>			
		</table>
		</div>
		
		<div id="login">

		<h2><span class="fontawesome-lock"></span><strong>INGRESAR | AUTENTICACIÓN</strong></h2>

			<fieldset>
				<table class="login2" border="0">	
				<tr><td><p><label for="email">Usuario</label></p></td><td><p><label for="password">Clave</label></p></td></tr>
				<tr><td><p> <p:inputText id="usuario"   placeholder="usuario"></p:inputText></p></td>
				<td><h:inputSecret id="clave" placeholder="clave" ><p:watermark value="clave" for="clave"></p:watermark></h:inputSecret></td></tr>
				<tr><td colspan="2"><hr></hr></td></tr>
				<tr><td colspan="2"><p><label>
				<t:captcha captchaSessionKeyName="captcha" id="captchaComponent" imageWidth="296" imageHeight="60"/>
				<h:commandLink >
					<h:graphicImage	value="/templates/images/flechas-azules-y-rojas.jpg" height="40" width="40"/>
				</h:commandLink></label></p></td></tr>
				<tr><td colspan="2"><hr></hr></td></tr>	
				<tr><td colspan="2"><p><label for="password">Debe Introducir el Código de Validación</label></p></td></tr>
				<tr><td colspan="2" class="capcha"><h:inputText id="valueID" value="#{loginBean.value}"  style="height:20px; width:330px;"/><p:watermark value="Indique el código de validación" for="valueID"></p:watermark></td></tr>
				<tr><td colspan="2"><h:commandButton value="Ingresar" action="#{loginBean.doAceptar()}" />
				<h:outputLabel value="" /></td></tr>
				</table>
						
			</fieldset>
	</div>
	<p:idleMonitor onactive="sessionTimeOutDialog.show();" timeout="#{session.maxInactiveInterval * 1000}" />
	<p:dialog header="Session Caducada" widgetVar="sessionTimeOutDialog" modal="true" fixedCenter="true" closable="false" width="400" visible="false">
	     <h:outputText value="La sesión ha caducado" />
	     <input id="confirmBackToLogin" type="button" value="Presione Aqui" onclick="window.location='#{facesContext.externalContext.requestContextPath}/login/login.xhtml';" />
	</p:dialog>
	</h:form>
</h:body>
</html>
